appId: gg.tame.lychee
productName: Lychee
# Shown in the macOS About window and Finder's Get Info, and in the Windows file properties.
copyright: Copyright © 2026 Anmol Kapil, © 2026 tame.gg
afterPack: scripts/check-torrent-package.mjs
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  # koffi ships prebuilds for every OS; it's loaded on Linux (network/deviceBinding.ts) and on
  # Windows (download/sparseFile.ts).
  - '!node_modules/koffi/{src,vendor,doc}/**'
  - '!node_modules/koffi/build/koffi/!(linux_x64|linux_arm64|win32_x64|win32_arm64)/**'
  # Lychee uses TCP peers only. simple-peer is patched to use browser globals instead of loading
  # the native WebRTC polyfill; don't ship unused host-platform binaries in cross-platform builds.
  - '!node_modules/node-datachannel/**'
  - '!node_modules/webrtc-polyfill/**'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # The Playwright suite and its config are development-only (e2e/netd/ holds the fake network
  # helper the tests talk to); nothing in the app loads them.
  - '!e2e/**'
  - '!{playwright.config.ts,tsconfig.e2e.json}'
asarUnpack:
  - resources/**
# Third-party credits (see NOTICE), copied next to app.asar in every build's resources folder.
extraResources:
  - from: NOTICE
    to: NOTICE
  - from: build/licenses/net-merge-LICENSE.txt
    to: licenses/net-merge-LICENSE.txt
win:
  # Wintun (wintun.dll) ships only in Windows builds, and its license must ship with it.
  # electron-builder adds this to the top-level extraResources above.
  extraResources:
    - from: build/licenses/wintun-LICENSE.txt
      to: licenses/wintun-LICENSE.txt
  # No protocols or fileAssociations: the NSIS installer would register Lychee as *the* handler for
  # magnet links and .torrent files, taking them from a torrent client the user already has.
  # A .torrent can still be opened with Lychee through "Open with".
  executableName: lychee
  target:
    - target: nsis
      arch: [x64, arm64]
nsis:
  # No ${arch} on purpose: one installer holds both x64 and ARM64, and release/downloads.js reads an
  # installer with no architecture in its name as exactly that. Add one here and update it there.
  artifactName: ${name}-${version}-setup.${ext}
  # Assisted installer instead of one-click, so users can choose the install folder (and drive).
  # One-click always installs to %LOCALAPPDATA%\Programs with no way to change it.
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  # Only the zips go by this name: the dmg has its own (dmg.artifactName).
  artifactName: ${name}-${version}-${arch}-mac.${ext}
  target:
    - target: dmg
      arch: [x64, arm64]
    # Not for people: the app's updater installs from these (see src/main/updater.ts).
    - target: zip
      arch: [x64, arm64]
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDownloadsFolderUsageDescription: Lychee saves downloaded files to your Downloads folder.
    # Magnet links and .torrent files can be opened with Lychee, as one choice among others: it's
    # never made the default over a torrent client the user already has (LSHandlerRank).
    # lychee:// is Lychee's own scheme, so registering it takes nothing from another app.
    - CFBundleURLTypes:
        - CFBundleURLName: Magnet link
          CFBundleURLSchemes: [magnet]
        - CFBundleURLName: Lychee
          CFBundleURLSchemes: [lychee]
      CFBundleDocumentTypes:
        - CFBundleTypeName: Torrent
          CFBundleTypeRole: Viewer
          LSHandlerRank: Alternate
          CFBundleTypeExtensions: [torrent]
          LSItemContentTypes: [org.bittorrent.torrent]
  # Ad-hoc signed by default: a downloaded ad-hoc app gets Gatekeeper's "unidentified developer"
  # prompt, where an unsigned one is reported as "damaged", and Apple Silicon won't run unsigned code.
  # Hardened runtime is off with it: its library validation rejects the ad-hoc signed Electron
  # Framework (no Team ID), and it only matters for notarization, which an ad-hoc build never gets.
  # With CSC_LINK/CSC_KEY_PASSWORD set, the release workflow turns both back on for a Developer ID
  # signature, notarized when APPLE_API_KEY, APPLE_API_KEY_ID and APPLE_API_ISSUER are set too (see
  # .github/workflows/release.yml). Only a Developer ID build can update itself: macOS checks an
  # update against the running app's signature, and an ad-hoc one matches no other build.
  identity: '-'
  hardenedRuntime: false
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
    - target: rpm
      arch: [x64, arm64]
  maintainer: electronjs.org
  category: Utility
  # Offered for magnet links and .torrent files ("Open with"), not made their default.
  mimeTypes: [x-scheme-handler/magnet, application/x-bittorrent, x-scheme-handler/lychee]
appImage:
  artifactName: ${name}-${version}-${arch}.${ext}
npmRebuild: false
# Where the app looks for updates: the one place the update address is set. electron-builder bakes
# it into the app (app-update.yml) and writes latest.yml, latest-mac.yml and latest-linux.yml plus
# the .blockmap files for it. Builds never publish themselves (--publish never): the release
# workflow uploads them to this folder under these fixed names.
publish:
  provider: generic
  url: https://cdn.tame.gg/lychee/
