name: Release

# Pushing a version tag (git tag v0.1.0 && git push origin v0.1.0) builds every OS
# and leaves a draft GitHub Release. Apps only see it once the draft is published.
#
# Run by hand (gh workflow run release.yml --ref <branch>) it's a dry run: the same builds, signed
# the same way, and no release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The tag names the version the build gets; a mismatch would ship one version as another. The
      # changelog entry becomes the release notes. Both are checked before the long build.
      - name: Check the tag matches package.json and has a changelog entry
        if: github.event_name == 'push'
        shell: bash
        run: |
          test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
          node scripts/release-notes.mjs "$GITHUB_REF_NAME" --changelog > /dev/null

      - name: Install rpmbuild
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Install dependencies
        run: npm ci

      # Without the certificate secrets the Mac build is ad-hoc signed (electron-builder.yml), and
      # can't update itself; with them it's Developer ID signed, and notarized too with the API key
      # ones. electron-builder's own CSC_LINK import, as documented; it needs 26.16.1+, before which
      # it unlocked its keychain with the wrong password (electron-userland/electron-builder#10101).
      # Exported on the Mac only: Windows would otherwise try to sign with CSC_LINK too.
      - name: Build
        shell: bash
        env:
          MAC_CERTIFICATE_P12_BASE64: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          mac_sign=()
          if [ "$RUNNER_OS" = macOS ] && [ -n "$MAC_CERTIFICATE_P12_BASE64" ]; then
            export CSC_LINK="$MAC_CERTIFICATE_P12_BASE64" CSC_KEY_PASSWORD="$MAC_CERTIFICATE_PASSWORD"
            # An empty identity finds the certificate on its own, in place of the ad-hoc "-"; and
            # notarization needs hardened runtime.
            mac_sign=(-c.mac.identity= -c.mac.hardenedRuntime=true)
            if [ -n "$APPLE_API_KEY_P8" ]; then
              echo "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple-api-key.p8"
              export APPLE_API_KEY="$RUNNER_TEMP/apple-api-key.p8"
            fi
          else
            # electron-builder notarizes whatever it signs when these are set, an ad-hoc signature
            # included, and Apple rejects that; with only some of them set it fails outright.
            unset APPLE_API_KEY_ID APPLE_API_ISSUER
          fi
          npm run build
          npx electron-builder ${{ matrix.target }} --publish never "${mac_sign[@]}"

      # Fails the job on a broken signature, ad-hoc or not. electron-builder also builds unsigned,
      # quietly, when it finds no identity; with the certificate secrets set the app has to be
      # Developer ID signed, as an ad-hoc or unsigned one could never install an update over it.
      # spctl is only informational: Gatekeeper rejects an ad-hoc app, and a signed one that isn't
      # notarized.
      - name: Verify the macOS code signature
        if: runner.os == 'macOS'
        shell: bash
        env:
          MAC_CERTIFICATE_P12_BASE64: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
        run: |
          for app in dist/mac/Lychee.app dist/mac-arm64/Lychee.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            # -dvv: plain -dv leaves the Authority lines out.
            codesign -dvv "$app" 2>&1 | grep -E "^(Signature|Authority|TeamIdentifier|Runtime)"
            if [ -n "$MAC_CERTIFICATE_P12_BASE64" ]; then
              codesign -dvv "$app" 2>&1 | grep "^Authority=Developer ID Application" > /dev/null
            fi
            spctl -a -vv "$app" || true
          done

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/latest*.yml
            dist/*.blockmap
          if-no-files-found: error

  # Uploads the builds to the CDN folder the app checks (electron-builder.yml's publish url), over
  # rsync + SSH. Skipped unless CDN_SSH_KEY, CDN_HOST (user@host) and CDN_PATH are all set. The
  # latest*.yml files go up last, so an app never sees a version whose files aren't there yet.
  # No --delete: older versions stay, so a half-updated app can still finish its download.
  cdn-upload:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CDN_SSH_KEY: ${{ secrets.CDN_SSH_KEY }}
      CDN_HOST: ${{ secrets.CDN_HOST }}
      CDN_PATH: ${{ secrets.CDN_PATH }}
    steps:
      - name: Check the CDN secrets
        id: secrets
        run: |
          if [ -n "$CDN_SSH_KEY" ] && [ -n "$CDN_HOST" ] && [ -n "$CDN_PATH" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CDN_SSH_KEY, CDN_HOST or CDN_PATH isn't set, so nothing is uploaded to the CDN."
          fi

      - uses: actions/download-artifact@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          path: dist
          merge-multiple: true

      - name: Upload to the CDN
        if: steps.secrets.outputs.ready == 'true'
        run: |
          key="$RUNNER_TEMP/cdn_key"
          (umask 077 && printenv CDN_SSH_KEY > "$key")
          chmod 600 "$key"
          trap 'rm -f "$key"' EXIT
          ssh_cmd="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts"
          dest="$CDN_HOST:${CDN_PATH%/}/lychee/"
          cd dist
          shopt -s nullglob
          files=(*.dmg *.zip *.exe *.AppImage *.deb *.rpm *.blockmap)
          meta=(latest*.yml)
          test ${#files[@]} -gt 0 && test ${#meta[@]} -gt 0
          rsync -av --mkpath -e "$ssh_cmd" -- "${files[@]}" "$dest"
          rsync -av -e "$ssh_cmd" -- "${meta[@]}" "$dest"

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    # Only this job writes: it creates the draft release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          node scripts/release-notes.mjs "$TAG" > "$RUNNER_TEMP/notes.md"
          node scripts/release-notes.mjs "$TAG" --files > "$RUNNER_TEMP/files.txt"
          # Not --prerelease, even for an rc: the app updates to the release GitHub marks Latest,
          # and a pre-release never is (see src/main/updater.ts).
          xargs -d '\n' gh release create "$TAG" --draft --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" < "$RUNNER_TEMP/files.txt"
